name: ClaudeApp
options:
  bundleIdPrefix: com.mizuki
  deploymentTarget:
    iOS: "12.0"
settings:
  SWIFT_VERSION: "5.0"
targets:
  ClaudeApp:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: ClaudeApp
        excludes:
          - Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mizuki.claudeios12
      INFOPLIST_FILE: ClaudeApp/Info.plist
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGNING_ALLOWED: "NO"
      ENABLE_BITCODE: "NO"
      ARCHS: "$(ARCHS_STANDARD)"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
